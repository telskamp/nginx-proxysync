services:
  nginx-proxy-sync:
    build: .
    container_name: nginx-proxy-sync
    restart: unless-stopped
    environment:
      NPM_SYNC_DATA_DIR: /data
      NPM_SYNC_PORT: 8080
    ports:
      - "${NPM_SYNC_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    volumes:
      - npm-sync-data:/data

volumes:
  npm-sync-data:
